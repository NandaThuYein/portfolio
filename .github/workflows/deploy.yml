name: Deploy Angular Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production
        env:
          # Optional: override githubUsername / contactFormUrl at build time.
          # Values are PUBLIC — never put secrets here.
          # NG_APP_GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          # NG_APP_CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}

      - name: Add GitHub Pages 404 fallback
        # Copies index.html to 404.html so deep links work on GitHub Pages
        # without hash routing.
        run: |
          cp dist/nanda-portfolio/browser/index.html \
             dist/nanda-portfolio/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/nanda-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
